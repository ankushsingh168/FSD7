<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container mt-5">
      <h2 class="text-center mb-4">Student Registration Form</h2>
      <form class="row g-3">
        <!-- Personal Information -->
        <div class="col-md-6">
          <label for="fullName" class="form-label">Full Name*</label>
          <input
            type="text"
            class="form-control"
            id="fullName"
            name="fullName"
            pattern="[A-Za-z]+"
            required
          />
          <div class="invalid-feedback">Enter alphabets and spaces only.</div>
        </div>

        <div class="col-md-6">
          <label for="email" class="form-label">Email Address*</label>
          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            required
          />
          <div class="invalid-feedback">
            Enter a valid email (e.g. name@example.com).
          </div>
        </div>

        <div class="col-md-6">
          <label for="mobile" class="form-label">Mobile Number*</label>
          <input
            type="text"
            class="form-control"
            id="mobile"
            name="mobile"
            pattern="[6-9][0-9]{9}"
            required
          />
          <div class="invalid-feedback">
            Enter a valid 10-digit Indian mobile number.
          </div>
        </div>

        <div class="col-md-6">
          <label for="dob" class="form-label">Date of Birth*</label>
          <input
            type="date"
            class="form-control"
            id="dob"
            name="dob"
            required
          />
          <div class="invalid-feedback">You must be at least 15 years old.</div>
        </div>
        <!-- Academic Details -->
        <div class="col-md-6">
          <label for="qualification" class="form-label"
            >Last Completed Qualification*</label
          >
          <select class="form-select" id="qualification" required>
            <option value="">Choose...</option>
            <option>10th</option>
            <option>12th</option>
            <option>Graduate</option>
            <option>Postgraduate</option>
          </select>
          <div class="invalid-feedback">Please select your qualification.</div>
        </div>
      </form>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>

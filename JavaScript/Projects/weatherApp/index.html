<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        height: 100vh;
        background: url(./weather.jpg);
        background-repeat: no-repeat;
        background-position: center;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .weather-box {
        width: 900px;
        background: white;
        padding: 20px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }

      .weather-box h1 {
        margin-bottom: 20px;
        color: #333;
      }

      .search-box {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      .search-box input {
        flex: 1;
        padding: 10px;
        border: 2px solid #0072ff;
        border-radius: 10px;
        outline: none;
        font-size: 16px;
      }

      .search-box button {
        padding: 10px 15px;
        border: none;
        background: #0072ff;
        color: white;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
      }

      .search-box button:hover {
        background: #005edb;
      }

      .weather-info img {
        width: 100px;
      }

      .temp {
        font-size: 45px;
        font-weight: bold;
        color: #222;
      }

      .city {
        font-size: 28px;
        margin: 10px 0;
        color: #444;
      }

      .details {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
      }

      .details div {
        background: #2ec6fd;
        padding: 10px;
        border-radius: 10px;
        width: 45%;
      }

      .details h3 {
        color: #efd50b;
        margin-bottom: 5px;
      }
      .head {
        background-color: #1a88ee;
        height: 50vh;
        width: 40vh;
      }
    </style>
  </head>
  <body>
    <div class="weather-box">
      <h1>Weather App</h1>

      <div class="search-box">
        <input type="text" id="cityInput" placeholder="Enter city name" />
        <button onclick="getWeather()">Search</button>
      </div>

      <div class="weather-info" id="weatherInfo">
        <!-- <img
          src="https://cdn-icons-png.flaticon.com/512/1163/1163661.png"
          alt=""
        /> -->

        <div class="temp" id="temp">--°C</div>
        <div class="city" id="city">City Name</div>

        <div class="details">
          <div>
            <h3>Humidity</h3>
            <p id="humidity">--%</p>
          </div>

          <div>
            <h3>Wind</h3>
            <p id="wind">-- km/h</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap Script -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>

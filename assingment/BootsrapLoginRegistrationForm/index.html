<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="bg-primary mt-5 pt-5 ">
    <div id="a1" class="d-flex justify-content-center gap-5 align-items-center vh-100 ">

      <div class=" card bg-light gap-4 w-25 p-4" id="login" >
        <h1><span class="heading"><u>Lo</u></span>gin</h1>
        <div class="w-100 border-bottom border-dark pb-2 d-flex gap-2 align-items-center">
          <i class="bi bi-envelope"></i>
          <input class="border border-0 border-dark form-control  "
            type="email"
            placeholder="Email"
            style="outline: none;"
          />
        </div>
        <div class="w-100 border-bottom border-dark pb-2 d-flex gap-2 align-items-center">
          <i class="bi bi-lock"></i>
          <input class="border border-0  border-dark form-control "
            type="password"
            name="password"
            id="loginPassword"
            placeholder="Password"
             style="outline: none;"
          />
          <i class="bi bi-eye"></i>
        </div>
        <div>
          <div>
            <input type="checkbox" name="remember" id="LoginRememberMe" />
            <span >Remember Me</span>
             <a href="#" class="m-4">Forget Password?</a>
          </div>
        
        </div>
        <button class="btn btn-outline-primary w-100 h4">Login Now</button>
        <p>Don't Have Account? <a href="#">Signup Now</a></p>
      </div>

      <!-- regestration form -->



      <div class="card d-flex  gap-4  w-25 p-4  " id="register">
        <h1><span class="heading"><u>Re</u></span>gistration</h1>
        <div class="w-100 border-bottom border-dark pb-2 d-flex gap-2 align-items-center">
          <i class="bi bi-person"></i>
          <input class="border border-0 border-dark "
            type="text"
            name="fullName"
            id="registerFullName"
            placeholder="Name"
             style="outline: none;"
          />
        </div>
        <div class="w-100 border-bottom border-dark pb-2 d-flex gap-2 align-items-center">
          <i class="bi bi-envelope"></i>
          <input class="border border-0  border-dark "
            type="email"
            name="email"
            id="registerEmail"
            placeholder="Email"
             style="outline: none;"
          />
        </div>
        
        <div class="w-100 border-bottom border-dark pb-2 d-flex gap-2 align-items-center" >
          <i class="bi bi-lock"></i>
          <input class="border border-0  border-dark"
            type="password"
            name="create_password"
            id="registerCreatePassword"
            placeholder="Create Password"
             style="outline: none;"
          />
        </div>
        <div class="w-100 border-bottom border-dark pb-2 d-flex gap-2 align-items-center">
          <i class="bi bi-lock"></i>
          <input class="border border-0 border-dark "
            type="password"
            name="confirm_password"
            id="registerConfirmPassword"
            placeholder="Confirm Password"
             style="outline: none;"
          />
          <i class="bi bi-eye"></i>
        </div>
        <div >
          <div>
            <input type="checkbox" name="acceptTerms" id="registerTerms" />
            <span>I agree all Terms and Condition</span>
          </div>
        </div >
        <button class="bg-primary w-100 h4">Register Now</button>
        <p>Already Have Account? <a href="#">Login Now</a></p>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>

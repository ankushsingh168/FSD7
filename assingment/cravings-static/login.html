<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="login.html">

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-3 shadow" style="width: 450px;">
            
            <h3 class="text-center mb-3">Welcome Back</h3>
            <p class="text-center">Login to your Cravings account</p>

            <form class="p-2">
                <div class="mb-3">
                    <label class=">Email</label>
                    <input type="email" class="form-control" placeholder="Enter email">
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="Enter password">
                </div>

                <div class="d-flex justify-content-between mb-3">
                    <div>
                        <input type="checkbox" class="form-check-input">
                        <label class="form-check-label">Remember me</label>
                    </div>
                    <a href="#" class="text-decoration-none text-danger">Forgot Password?</a>
                </div>

                <button type="submit" class="btn  w-100 text-white rounded-2" style="height: 45px; background-color:#c2410c; " >Login</button>
                <p class="text-center mt-4">_______ Don't have an account?_______</p>
                <a href="#1" class="text-center p-5 mx-lg-5">Create an account</a>

                

            </form>

        </div>
    </div>

</body>
</html>
